# Include INSIDE an existing HTTPS server{} after checking path collisions.
# Public origin in gateway.json must exactly match that HTTPS origin (incl. port).
# Client MCP endpoint: https://HOST/reset/mcp; login paths under /reset/auth/.
location = /reset/mcp {
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:3100/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;
}
location = /reset/auth/challenge {
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:3100/auth/challenge;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_cache off;
}
location = /reset/auth/login {
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:3100/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_cache off;
}
